// OPTIONAL LEGACY MODE: executing this file replaces fourteen personal bindings.
// Default native controls need no binds: hold Walk+Reload for the menu.
css_nl_controls legacy
// NadeLab legacy training controls. E/R/Shift retain their existing game bindings.
// Wheel is menu-only; use number keys for weapons. W/S always move.
// Original wheel bindings (including jump) are saved by the installer.
bind F1 "exec nadelab_keys; css_nl"
bind F2 css_nl_area
bind F3 css_nl_grenade
bind F4 css_nl_effect
bind F5 css_nl_place
bind F6 css_nl_step
bind F7 css_nl_next
bind F8 css_nl_reposition
bind F9 css_nl_camera
bind UPARROW css_nl_panel_up
bind DOWNARROW css_nl_panel_down
bind MWHEELUP css_nl_wheel_up
bind MWHEELDOWN css_nl_wheel_down
bind v noclip
echo "NadeLab: F1 reloads keys + panel; Shift+E up / Shift+R down; wheel or arrows select; WASD move; E confirm; R back; V fly; number keys select weapons"
